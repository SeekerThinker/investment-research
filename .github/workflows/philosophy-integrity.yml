name: Investment Philosophy Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "philosophy/**"
      - "metadata/philosophy-integration.md"
      - "monitor/validate_philosophy.py"
      - "monitor/validate_collaboration.py"
      - "START_HERE.md"
      - "AGENTS.md"
      - "docs/project-state.md"
      - "docs/collaboration-review.md"
      - "README.md"
      - "site/index.html"
      - ".github/workflows/philosophy-integrity.yml"
  pull_request:
    paths:
      - "philosophy/**"
      - "metadata/philosophy-integration.md"
      - "monitor/validate_philosophy.py"
      - "monitor/validate_collaboration.py"
      - "START_HERE.md"
      - "AGENTS.md"
      - "docs/project-state.md"
      - "docs/collaboration-review.md"
      - "README.md"
      - "site/index.html"
      - ".github/workflows/philosophy-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify philosophy library, idea IDs and cross-document links
        run: python monitor/validate_philosophy.py
      - name: Verify repository handoff links and explicit authority boundaries
        run: python monitor/validate_collaboration.py
