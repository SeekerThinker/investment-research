name: Align Open Research Policy (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/align-open-research.yml"

permissions:
  contents: write

concurrency:
  group: research-machine-data
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical research repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify explicitly authorized public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "SeekerThinker/investment-research"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "false"
      - name: Refresh main and align existing policy without rewriting other content
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('metadata/research-os.md')
          old='- 目标仓库存在、`visibility=private` 且当前连接具备 write/push 权限；任一条件不满足立即停止写入，不得改写到其他仓库。'
          new='- 目标仓库存在、`visibility=public`（项目所有者明确批准的当前状态）且当前连接具备 write/push 权限；任一条件不满足立即停止写入，不得改写到其他仓库。公开仓库不得写入密码、token、个人隐私或无再分发许可的第三方数据。'
          text=p.read_text(encoding='utf-8')
          assert text.count(old)==1, 'expected one obsolete visibility guard; do not overwrite unexpected content'
          p.write_text(text.replace(old,new),encoding='utf-8')
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          a='Private research repository for A-share and Hong Kong Stock Connect investment research.'
          b='Public, auditable A-share and Hong Kong Stock Connect research project. All published reports are free to read; voluntary sponsorship does not change access or research conclusions.'
          assert text.count(a)==1, 'expected original README introduction'
          text=text.replace(a,b).replace('- Private research workbench:', '- Research workbench:')
          text=text.replace('## Workbench', 'Website: https://seekerthinker.github.io/investment-research/ (free report archive and voluntary support; payment link not yet enabled).\n\n## Workbench',1)
          p.write_text(text,encoding='utf-8')
          print('PASS: Research OS visibility guard and README updated without other changes')
          PY
          python monitor/validate_research_os.py
      - name: Commit scoped policy correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/research-os.md README.md
          git diff --cached --check
          git commit -m "research os: align repository visibility with owner-approved public release"
          git push origin HEAD:main
