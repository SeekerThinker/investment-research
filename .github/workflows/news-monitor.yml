name: Market Research Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news-monitor.yml"
      - "monitor/news_monitor.py"
      - "monitor/news_monitor_v2.py"
      - "monitor/config.yaml"
      - "monitor/render_dashboard.py"
      - "monitor/validate_research_os.py"
      - "monitor/requirements.txt"
  schedule:
    - cron: "17 */2 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: research-machine-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r monitor/requirements.txt

      - name: Compile monitor code
        run: python -m py_compile monitor/news_monitor.py monitor/news_monitor_v2.py monitor/render_dashboard.py monitor/validate_research_os.py

      - name: Validate research database before collection
        run: python monitor/validate_research_os.py

      - name: Collect news discovery data
        id: collector
        shell: bash
        run: |
          code=0
          python monitor/news_monitor_v2.py || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render dashboard
        run: python monitor/render_dashboard.py

      - name: Validate research database after collection
        run: python monitor/validate_research_os.py

      - name: Sync latest branch and commit discovery refresh
        shell: bash
        run: |
          set -u
          snapshot="/tmp/news-refresh-${GITHUB_RUN_ID}"
          rm -rf "$snapshot"
          mkdir -p "$snapshot"
          cp -a data/news/. "$snapshot"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publishing news refresh, attempt ${attempt}/3"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            rm -rf data/news
            mkdir -p data/news
            cp -a "$snapshot"/. data/news/

            python monitor/render_dashboard.py
            python monitor/validate_research_os.py

            git add data/news dashboard/README.md
            if git diff --cached --quiet; then
              echo "No news/discovery changes to commit."
              exit 0
            fi

            git commit -m "machine news discovery: ${GITHUB_RUN_ID}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "News/discovery refresh published."
              exit 0
            fi

            echo "Push raced with another writer; retrying on top of latest ${GITHUB_REF_NAME}."
          done

          echo "Unable to publish news/discovery refresh after 3 attempts."
          exit 1

      - name: Fail run when primary discovery backbone is down
        if: always() && steps.collector.outputs.exit_code != '0'
        run: |
          echo "News collector returned exit code ${{ steps.collector.outputs.exit_code }} after persisting available health/data."
          exit 1
