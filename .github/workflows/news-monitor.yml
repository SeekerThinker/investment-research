name: Market Research Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor/news_monitor*.py'
      - 'monitor/render_dashboard.py'
      - 'monitor/validate_research_os.py'
      - 'monitor/config.yaml'
      - 'metadata/**'
      - 'index/**'
      - 'tracking/**'
      - 'latest/**'
      - '.github/workflows/news-monitor.yml'
  schedule:
    - cron: '17,47 7-18 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '17 19-23,0-6 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: market-research-monitor
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r monitor/requirements.txt

      - name: Validate collectors and Research OS
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile monitor/news_monitor.py monitor/news_monitor_v2.py monitor/market_providers.py monitor/market_behavior_v2.py monitor/render_dashboard.py monitor/validate_research_os.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('monitor/config.yaml').read_text(encoding='utf-8'))
          assert isinstance(cfg, dict)
          assert cfg.get('gdelt', {}).get('queries'), 'No GDELT discovery queries configured'
          rss = cfg.get('rss') or []
          assert rss, 'No direct RSS sources configured'
          tier1 = [s for s in rss if int(s.get('tier', 9)) == 1 and s.get('enabled', True)]
          assert len(tier1) >= 3, 'At least three enabled tier-1 direct feeds are required'
          assert any('stats.gov.cn' in s.get('url', '') for s in tier1), 'NBS official feed missing'
          assert any('hkex.com.hk' in s.get('url', '') for s in tier1), 'HKEX official feed missing'
          print(f'collector configuration validated: {len(tier1)} tier-1 direct feeds')
          PY
          python monitor/validate_research_os.py

      - name: Collect and rank news
        run: python monitor/news_monitor_v2.py

      - name: Render workbench
        run: python monitor/render_dashboard.py

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s data/news/latest.md
          test -s data/news/state.json
          test -s data/news/health.json
          test -s data/market/README.md
          test -s dashboard/README.md
          test -s metadata/research-os.md
          test -s metadata/market-behavior.md
          test -s tracking/market-behavior.md
          test -s tracking/leading-indicators.md
          test -s tracking/model-audit.md
          python - <<'PY'
          import json
          from pathlib import Path
          news = json.loads(Path('data/news/health.json').read_text(encoding='utf-8'))
          print('news health:', news)
          if not news.get('operational', False):
              raise SystemExit(f"news monitor is not operational: {news}")
          if news.get('status') == 'degraded':
              print('::warning::News layer operational but degraded; see data/news/health.json')
          dashboard = Path('dashboard/README.md').read_text(encoding='utf-8')
          for required in ('最新市场行为机器快照', 'Market Behavior 研究判断', '最新新闻监控', '最新日报', '当前投资主题', '当前研究标的', '当前可证伪研究假设', '领先指标', 'Model Audit', '近期风险 / 催化事件日历'):
              assert required in dashboard, f'missing dashboard section: {required}'
          PY

      - name: Commit monitor state and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news dashboard/README.md
          if git diff --cached --quiet; then
            echo "No monitor or dashboard changes to commit."
            exit 0
          fi
          git commit -m "research monitor: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
