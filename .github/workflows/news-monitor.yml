name: Market Research Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 7-18 * * *"
      timezone: Asia/Shanghai
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile monitor/news_monitor.py monitor/news_monitor_v2.py monitor/render_dashboard.py monitor/validate_research_os.py
