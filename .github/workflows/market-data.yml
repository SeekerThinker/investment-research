name: Daily Market Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/market-data.yml"
      - "monitor/market_behavior_v2.py"
      - "monitor/market_providers.py"
      - "monitor/render_dashboard.py"
      - "monitor/validate_research_os.py"
      - "monitor/requirements.txt"
      - "index/securities.md"
  schedule:
    - cron: "25 16 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: research-machine-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r monitor/requirements.txt

      - name: Compile monitor code
        run: python -m py_compile monitor/market_providers.py monitor/market_behavior_v2.py monitor/render_dashboard.py monitor/validate_research_os.py

      - name: Validate research database before collection
        run: python monitor/validate_research_os.py

      - name: Collect market data
        id: collector
        shell: bash
        run: |
          code=0
          python monitor/market_behavior_v2.py --force || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mark stale-cache fallback as degraded
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path("data/market/latest.json")
          health_path = Path("data/market/health.json")
          if not latest_path.exists() or not health_path.exists():
              raise SystemExit(0)

          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          health = json.loads(health_path.read_text(encoding="utf-8"))
          stale = [item.get("code") for item in latest.get("items", []) if item.get("provider") == "local_cache_stale"]
          if stale:
              health["status"] = "degraded"
              health["stale_cache_legs"] = stale
              health["stale_cache_count"] = len(stale)
              health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Marked market health degraded because stale cache was used for: {', '.join(stale)}")
          PY

      - name: Render dashboard
        run: python monitor/render_dashboard.py

      - name: Validate research database after collection
        run: python monitor/validate_research_os.py

      - name: Commit machine-data refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market dashboard/README.md
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git commit -m "machine market data: ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail run when live market collection is down
        if: always() && steps.collector.outputs.exit_code != '0'
        run: |
          echo "Market collector returned exit code ${{ steps.collector.outputs.exit_code }} after persisting available health/data."
          exit 1
